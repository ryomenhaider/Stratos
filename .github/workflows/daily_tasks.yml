name: Daily Tasks Email

on:
  schedule:
    # 08:00 Asia/Karachi (UTC+5) = 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send-daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Send daily task emails
        run: python scripts/run_automation.py daily_tasks overdue_reminder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}